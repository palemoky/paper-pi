services:
  paper-pi:
    image: palemoky/paper-pi:latest
    container_name: paper-pi
    restart: unless-stopped
    privileged: true # MUST, for GPIO
    env_file: .paper-pi.env
    devices:
      - /dev/spidev0.0:/dev/spidev0.0
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - paper-pi-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No hard dependency - poetry-api is optional via profiles

  poetry-api:
    image: palemoky/chinese-poetry-api:latest
    container_name: poetry-api
    restart: unless-stopped
    env_file: .poetry-api.env
    ports:
      - "${PORT:-1279}:${PORT:-1279}"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - poetry-api-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - poetry # Only start when poetry mode is needed

volumes:
  paper-pi-data:
  poetry-api-data:
