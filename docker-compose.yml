services:
  paper-pi:
    image: palemoky/paper-pi:latest
    container_name: paper-pi
    restart: unless-stopped
    privileged: true # MUST, for GPIO
    env_file: .paper-pi.env
    devices:
      - /dev/spidev0.0:/dev/spidev0.0
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - paper-pi-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  paper-pi-data:
